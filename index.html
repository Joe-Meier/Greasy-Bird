  const i = new Image(); i.src = "data:image/png;base64," + b; return i;
});
const P_H = 140;
function pDims(img){
  const pw = Math.max(80, Math.min(118, Math.round(P_H * img.width / img.height)));
  return { pw, ph: Math.round(pw * img.height / img.width) };
}

// ---------- canvas ----------
const W = 360, H = 560;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();
ctx.imageSmoothingEnabled = false;

// ---------- audio ----------
let AC = null;
function audio(){ if (!AC){ try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(type, f0, f1, dur, gain){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfxFlap  = () => tone('square', 320, 540, 0.07, 0.10);
const sfxScore = () => { tone('sine', 660, 660, 0.07, 0.12); setTimeout(() => tone('sine', 880, 880, 0.09, 0.12), 70); };
const sfxDie   = () => tone('sawtooth', 220, 55, 0.3, 0.16);

// ---------- state ----------
const GRAV = 1500, FLAP = -420, GAP = 205, SPACING = 235;
const GROUND_H = 46;
let state = 'ready', bird, obstacles = [], worldX = 0, score = 0, best = 0, t = 0;
let grease = [], flashT = 0, nextSpawnX = 480, scorePop = 0;
const speed = () => 130 + Math.min(70, score * 2.5);

function reset(){
  bird = { x: 92, y: H*0.58, vy: 0, r: 17 };
  obstacles = []; worldX = 0; score = 0; grease = [];
  nextSpawnX = 480;
  state = 'ready';
}

// ---------- input ----------
function tap(){
  audio();
  if (state === 'ready'){ state = 'play'; flap(); }
  else if (state === 'play'){ flap(); }
  else if (state === 'dead' && t > deadT + 0.5){ reset(); }
}
function flap(){
  bird.vy = FLAP; sfxFlap();
  for (let i = 0; i < 3; i++){
    grease.push({ x: bird.x - 18, y: bird.y + 8, vx: -60 - Math.random()*60,
      vy: (Math.random()-0.3)*90, life: 0.6 + Math.random()*0.3, r: 2 + Math.random()*2 });
  }
}
addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); tap(); } });

// ---------- obstacles ----------
function spawn(worldEdge){
  const idx = Math.floor(Math.random()*pImgs.length);
  const topIdx = Math.floor(Math.random()*pImgs.length);
  const gapY = 110 + Math.random() * (H - GROUND_H - GAP - 190);
  obstacles.push({ x: worldEdge, gapY, idx, topIdx, scored: false, w: 84 });
}

function drawShaft(x, y0, y1, w){
  if (y1 <= y0) return;
  ctx.fillStyle = '#2f9e1c'; ctx.fillRect(x, y0, w, y1 - y0);
  ctx.fillStyle = '#5ed13a'; ctx.fillRect(x + Math.round(w*0.14), y0, Math.round(w*0.12), y1 - y0);
  ctx.fillStyle = '#a8f05a'; ctx.fillRect(x + Math.round(w*0.30), y0, Math.round(w*0.10), y1 - y0);
  ctx.fillStyle = '#1c6b10'; ctx.fillRect(x + Math.round(w*0.80), y0, Math.round(w*0.12), y1 - y0);
  ctx.fillStyle = '#0d3a07'; ctx.fillRect(x, y0, 3, y1 - y0); ctx.fillRect(x + w - 3, y0, 3, y1 - y0);
}
function drawRim(x, y, w, h){
  ctx.fillStyle = '#0d3a07'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = '#2f9e1c'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#5ed13a'; ctx.fillRect(x + Math.round(w*0.12), y, Math.round(w*0.12), h);
  ctx.fillStyle = '#a8f05a'; ctx.fillRect(x + Math.round(w*0.27), y, Math.round(w*0.10), h);
  ctx.fillStyle = '#1c6b10'; ctx.fillRect(x + Math.round(w*0.82), y, Math.round(w*0.11), h);
  ctx.fillStyle = '#d0ff9a'; ctx.fillRect(x, y, w, 3);
  ctx.fillStyle = '#0d3a07'; ctx.fillRect(x, y + h - 3, w, 3);
}

function drawObstacle(o){
  const sx = Math.round(o.x - worldX);
  if (sx < -160 || sx > W + 60) return;
  const w = o.w, rimW = w + 14, rimH = 24, rimX = sx - 7;

  { // bottom: person rises from pipe; shaft runs to screen bottom
    const img = pImgs[o.idx];
    const { pw, ph } = pDims(img);
    const pTop = Math.round(o.gapY + GAP);
    const rimY = pTop + ph - 14;
    drawShaft(sx, rimY + rimH - 2, H, w);
    ctx.drawImage(img, sx + w/2 - pw/2, pTop, pw, ph);
    drawRim(rimX, rimY, rimW, rimH);
  }
  { // top: person hangs upside-down; shaft runs from screen top
    const img = pImgs[o.topIdx];
    const { pw, ph } = pDims(img);
    const pBot = Math.round(o.gapY);
    const rimY = pBot - ph - rimH + 14;
    drawShaft(sx, 0, Math.max(0, rimY + 2), w);
    ctx.save();
    ctx.translate(sx + w/2, pBot - ph/2);
    ctx.scale(1, -1);
    ctx.drawImage(img, -pw/2, -ph/2, pw, ph);
    ctx.restore();
    drawRim(rimX, rimY, rimW, rimH);
  }
}

function hitTest(o){
  const sx = o.x - worldX;
  const bx = bird.x, by = bird.y, r = bird.r;
  if (bx + r < sx + 8 || bx - r > sx + o.w - 8) return false;
  return (by - r < o.gapY) || (by + r > o.gapY + GAP);
}

// ---------- background ----------
function drawBG(){
  if (!bgImg.complete || !bgImg.naturalWidth){ ctx.fillStyle = '#20140c'; ctx.fillRect(0,0,W,H); return; }
  const bw = bgImg.naturalWidth * (H / bgImg.naturalHeight);
  const off = ((worldX * 0.5) % bw + bw) % bw;
  for (let x = -off; x < W; x += bw) ctx.drawImage(bgImg, x, 0, bw, H);
  ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,W,H);
}

// ---------- bird & fx ----------
function drawBirdSprite(){
  const ang = state === 'ready' ? Math.sin(t*3)*0.08
            : Math.max(-0.45, Math.min(0.9, bird.vy / 600));
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(state === 'dead' ? 1.2 : ang);
  const w = 58, h = Math.round(w * birdImg.height / birdImg.width);
  ctx.drawImage(birdImg, -w/2, -h/2, w, h);
  ctx.restore();
}
function drawGrease(dt){
  for (let i = grease.length - 1; i >= 0; i--){
    const p = grease[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt;
    if (p.life <= 0){ grease.splice(i,1); continue; }
    ctx.fillStyle = `rgba(92,62,24,${Math.min(1, p.life*1.6)})`;
    ctx.fillRect(p.x, p.y, p.r, p.r);
  }
}

// ---------- UI ----------
function px(txt, x, y, size, fill, align){
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align || 'center';
  ctx.fillStyle = '#000'; ctx.fillText(txt, x+2, y+2);
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}
function drawLogo(cx, y, lw){
  if (!logoImg.complete || !logoImg.naturalWidth) return 0;
  const lh = Math.round(lw * logoImg.height / logoImg.width);
  ctx.drawImage(logoImg, cx - lw/2, y, lw, lh);
  return lh;
}
function drawUI(){
  if (state === 'ready'){
    const lh = drawLogo(W/2, 46 + Math.sin(t*2)*3, 300);
    if (!lh) px('GREASY BIRD', W/2, 120, 30, '#f2ce4a');
    px("GAY ST · KNOXVILLE, TN", W/2, 46 + (lh || 100) + 26, 12, '#fff');
    px('TAP / SPACE TO FLAP', W/2, 448, 13, '#fff');
    if (Math.floor(t*2) % 2) px('▲', W/2, 476, 16, '#f2ce4a');
  } else if (state === 'play'){
    const s = 40 + scorePop * 14;
    px(String(score), W/2, 70 + scorePop * 4, Math.round(s), '#fff');
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
    const lh = drawLogo(W/2, 64, 210);
    px('GREASED.', W/2, 64 + (lh || 80) + 44, 26, '#e8452c');
    px('SCORE ' + score, W/2, 64 + (lh || 80) + 84, 18, '#fff');
    px('BEST  ' + best,  W/2, 64 + (lh || 80) + 110, 18, '#f2ce4a');
    if (t > deadT + 0.5) px('TAP TO RESTART', W/2, 64 + (lh || 80) + 160, 13, '#fff');
  }
  if (flashT > 0){ ctx.fillStyle = `rgba(255,255,255,${flashT})`; ctx.fillRect(0,0,W,H); }
}

// ---------- loop ----------
let last = performance.now(), deadT = 0;
function die(){
  if (state === 'dead') return;
  state = 'dead'; deadT = t; flashT = 0.6;
  best = Math.max(best, score);
  sfxDie();
}
function step(now){
  const dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
  flashT = Math.max(0, flashT - dt*2);
  scorePop = Math.max(0, scorePop - dt*4);

  if (state === 'play'){
    worldX += speed() * dt;
    bird.vy += GRAV * dt;
    bird.y += bird.vy * dt;

    if (worldX + W + 100 > nextSpawnX){ spawn(nextSpawnX + W); nextSpawnX += SPACING; }
    obstacles = obstacles.filter(o => o.x - worldX > -160);

    for (const o of obstacles){
      if (!o.scored && o.x - worldX + o.w < bird.x){ o.scored = true; score++; scorePop = 1; sfxScore(); }
      if (hitTest(o)) die();
    }
    if (bird.y + bird.r > H - GROUND_H){ bird.y = H - GROUND_H - bird.r; die(); }
    if (bird.y - bird.r < 0){ bird.y = bird.r; bird.vy = 0; }
  } else if (state === 'ready'){
    bird.y = H*0.58 + Math.sin(t*3)*8;
  } else if (state === 'dead' && bird.y + bird.r < H - GROUND_H){
    bird.vy += GRAV * dt; bird.y = Math.min(H - GROUND_H - bird.r, bird.y + bird.vy * dt);
  }

  drawBG();
  for (const o of obstacles) drawObstacle(o);
  drawGrease(dt); drawBirdSprite(); drawUI();
  requestAnimationFrame(step);
}

let ready = 0;
[birdImg, bgImg, logoImg, ...pImgs].forEach(i => i.onload = () => { if (++ready === 7){ reset(); requestAnimationFrame(step); } });
</script>
